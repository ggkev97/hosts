{% extends "base.html" %}
{% block title %}Log in · porn-hunter{% endblock %}
{% block content %}
<form class="login stack" method="post">
  <h2>Log in</h2>
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <label>Access token <input type="password" name="token" autocomplete="current-password" autofocus required></label>
  {% if error %}<p class="notice error" role="alert">{{ error }}</p>{% endif %}
  <button class="btn primary" type="submit">Log in</button>
</form>
{% endblock %}
